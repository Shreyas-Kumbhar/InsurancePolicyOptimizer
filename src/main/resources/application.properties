# Spring Boot Server Configuration
server.port=3647

# Application Name
spring.application.name=shield

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/policies_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Parameters
# A 256-bit (64 hex characters) secure key for HS256 algorithm
jwt.secret=9a67a86c656d2524e93d56a297e68cfbbf968b5ea91217e948c264a2c5a6c6e7a2b2c3d4e5f6
# Expiration: 24 hours (86,400,000 milliseconds)
jwt.expiration=86400000

# File Upload Limit Configuration (Optional but good practice)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
