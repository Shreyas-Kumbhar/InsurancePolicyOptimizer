<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ── NAVBAR FRAGMENT ── -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top shadow-sm py-3 px-4">
  <div class="container">
    <a class="navbar-brand text-primary font-headline fw-bold" style="font-size:1.5rem;" href="/">Suraksha Shield</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
        <li class="nav-item" sec:authorize="!hasRole('ADMIN')">
          <a class="nav-link" href="/policies">Find a Policy</a>
        </li>
        <li class="nav-item" sec:authorize="!hasRole('ADMIN')">
          <a class="nav-link" href="/#how-it-works">How it Works</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <!-- Logged-in ADMIN -->
        <div sec:authorize="hasRole('ADMIN')">
          <a href="/admin/dashboard" class="btn btn-outline-danger fw-semibold px-4 rounded-3 shadow-sm me-2">Admin Dashboard</a>
          <a href="/logout" class="btn btn-danger fw-semibold px-4 rounded-3 shadow-sm">Log Out</a>
        </div>
        <!-- Logged-in USER -->
        <div sec:authorize="hasRole('USER')">
          <span class="text-secondary me-3 d-none d-md-inline">
            Welcome, <strong th:text="${#authentication.principal instanceof T(com.suraksha.shield.service.CustomUserDetails) ? #authentication.principal.firstName : #authentication.name}">User</strong>
          </span>
          <a href="/profile" class="btn btn-outline-primary fw-semibold px-4 rounded-3 shadow-sm me-2">My Profile</a>
          <a href="/logout" class="btn btn-outline-danger fw-semibold px-4 rounded-3 shadow-sm">Log Out</a>
        </div>
        <!-- Not logged in -->
        <div sec:authorize="isAnonymous()">
          <a href="/login" class="text-primary text-decoration-none fw-semibold me-3">Log In</a>
          <a href="/register" class="btn btn-primary fw-semibold px-4 rounded-3 shadow-sm">Register</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- ── FLASH MESSAGES FRAGMENT ── -->
<div th:fragment="flash">
  <div th:if="${successMsg}" class="container mt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${successMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  </div>
  <div th:if="${errorMsg}" class="container mt-3">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  </div>
</div>

<!-- ── FOOTER FRAGMENT ── -->
<footer th:fragment="footer" class="bg-light w-100 border-top mt-auto py-5">
  <div class="container px-4">
    <div class="row align-items-center">
      <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
        <span class="fs-5 fw-bold text-primary font-headline d-block mb-1">Suraksha Shield</span>
        <span class="small text-secondary">© 2026 Suraksha Shield. Secure. Optimized.</span>
      </div>
      <div class="col-md-6 d-flex flex-wrap justify-content-center justify-content-md-end gap-4 small text-secondary">
        <a class="text-secondary text-decoration-none" href="#">Terms of Service</a>
        <a class="text-secondary text-decoration-none" href="#">Privacy Policy</a>
        <a class="text-secondary text-decoration-none" href="#">Contact Us</a>
      </div>
    </div>
  </div>
</footer>

<!-- ── HEAD FRAGMENT ── -->
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' - Suraksha Shield'">Suraksha Shield</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>.material-symbols-outlined { font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }</style>
</head>

</html>
