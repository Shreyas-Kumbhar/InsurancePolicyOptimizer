<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="flex-grow-1 bg-light py-5">
  <div class="container py-3">
    <div class="row mb-4">
      <div class="col-12">
        <h1 class="display-5 fw-bolder font-headline text-dark mb-2">My Dashboard</h1>
        <p class="fs-5 text-secondary">Welcome back, <span th:text="${user.firstName}">User</span>!</p>
      </div>
    </div>

    <div class="row g-4">
      <!-- Profile Card -->
      <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 h-100">
          <div class="card-body p-4 text-center">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
              <span class="material-symbols-outlined fs-1">account_circle</span>
            </div>
            <h4 class="fw-bold mb-1" th:text="${user.firstName + ' ' + user.lastName}">Name</h4>
            <p class="text-secondary mb-0" th:text="${user.email}">email</p>
          </div>
        </div>
      </div>

      <!-- Allocated Policies -->
      <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-4 h-100">
          <div class="card-header bg-white border-bottom p-4">
            <h4 class="mb-0 fw-bold font-headline d-flex align-items-center gap-2">
              <span class="material-symbols-outlined text-primary">inventory_2</span>
              My Allocated Policies
            </h4>
          </div>
          <div class="card-body p-0">
            <!-- Has policies -->
            <div th:if="${not #sets.isEmpty(policies)}" class="list-group list-group-flush rounded-bottom-4">
              <div th:each="policy : ${policies}" class="list-group-item p-4">
                <div class="d-flex w-100 justify-content-between align-items-center">
                  <div>
                    <h5 class="mb-1 fw-bold text-dark" th:text="${policy.name}">Policy Name</h5>
                    <p class="mb-1 text-secondary">
                      <span th:text="${policy.provider}">Provider</span> •
                      <span class="text-capitalize" th:text="${policy.type}">Type</span> Insurance
                    </p>
                    <div class="d-flex gap-3 mt-2">
                      <span class="badge bg-light text-dark border">
                        Premium: ₹<span th:text="${#numbers.formatInteger(policy.premium,1,'COMMA')}">0</span>
                      </span>
                      <span class="badge bg-light text-dark border">
                        Coverage: ₹<span th:text="${#numbers.formatInteger(policy.coverage,1,'COMMA')}">0</span>
                      </span>
                    </div>
                  </div>
                  <div class="d-flex gap-2 align-items-center">
                    <a th:href="@{/policies/{id}(id=${policy.id})}" class="btn btn-sm btn-outline-primary">View</a>
                    <form th:action="@{/profile/deallocate/{id}(id=${policy.id})}" method="post" class="mb-0">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-sm btn-outline-danger"
                              onclick="return confirm('Remove this policy from your profile?')">Remove</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
            <!-- No policies -->
            <div th:if="${#sets.isEmpty(policies)}" class="text-center p-5">
              <span class="material-symbols-outlined text-secondary mb-3" style="font-size:4rem;opacity:.5;">find_in_page</span>
              <h5 class="text-secondary fw-semibold">No Policies Allocated Yet</h5>
              <p class="text-muted mb-4">Run the optimization engine to find the best policies for your needs.</p>
              <a href="/policies" class="btn btn-primary rounded-pill px-4 fw-bold">Find Policies</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
