<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - Edit Policy</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <div class="container py-5 flex-grow-1" id="form-container" style="display: none;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold font-headline mb-0">Edit Policy</h2>
                    <a href="/admin/dashboard" class="btn btn-outline-secondary fw-bold">Cancel</a>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div id="form-error-placeholder"></div>

                        <!-- Loading Spinner inside card -->
                        <div id="form-loading" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <form id="editPolicyForm" style="display: none;">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label fw-semibold">Policy Name</label>
                                    <input type="text" class="form-control form-control-lg rounded-3" id="name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="provider" class="form-label fw-semibold">Provider</label>
                                    <input type="text" class="form-control form-control-lg rounded-3" id="provider" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="type" class="form-label fw-semibold">Policy Type</label>
                                    <select class="form-select form-select-lg rounded-3" id="type" required>
                                        <option value="life">Life Insurance</option>
                                        <option value="health">Health Insurance</option>
                                        <option value="car">Car Insurance</option>
                                        <option value="home">Home Insurance</option>
                                        <option value="travel">Travel Insurance</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="riskLevel" class="form-label fw-semibold">Risk Level</label>
                                    <select class="form-select form-select-lg rounded-3" id="riskLevel" required>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="premium" class="form-label fw-semibold">Premium (₹)</label>
                                    <input type="number" class="form-control form-control-lg rounded-3" id="premium" min="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="coverage" class="form-label fw-semibold">Coverage (₹)</label>
                                    <input type="number" class="form-control form-control-lg rounded-3" id="coverage" min="0" required>
                                </div>
                                <div class="col-12 mt-5">
                                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold">Update Policy</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Guard clause: requires ADMIN role
            if (!getToken() || getRole() !== 'ADMIN') {
                window.location.href = '/admin/login';
                return;
            }

            document.getElementById('form-container').style.display = 'block';

            // Parse policy ID from pathname
            const pathParts = window.location.pathname.split('/');
            const policyId = pathParts[pathParts.length - 2];

            try {
                // Fetch current details
                const response = await fetch(`/api/policies/${policyId}`);
                if (!response.ok) {
                    throw new Error('Policy details could not be found.');
                }

                const policy = await response.json();
                
                // Populate form fields
                document.getElementById('name').value = policy.name;
                document.getElementById('provider').value = policy.provider;
                document.getElementById('type').value = policy.type;
                document.getElementById('riskLevel').value = policy.riskLevel;
                document.getElementById('premium').value = policy.premium;
                document.getElementById('coverage').value = policy.coverage;

                document.getElementById('form-loading').style.display = 'none';
                document.getElementById('editPolicyForm').style.display = 'block';

            } catch (err) {
                console.error(err);
                document.getElementById('form-loading').style.display = 'none';
                showFlash(err.message, 'danger');
            }

            const form = document.getElementById('editPolicyForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const payload = {
                    name: document.getElementById('name').value,
                    provider: document.getElementById('provider').value,
                    type: document.getElementById('type').value,
                    riskLevel: document.getElementById('riskLevel').value,
                    premium: parseInt(document.getElementById('premium').value),
                    coverage: parseInt(document.getElementById('coverage').value)
                };

                const errorPlaceholder = document.getElementById('form-error-placeholder');
                errorPlaceholder.innerHTML = '';

                try {
                    const response = await fetchWithAuth(`/api/admin/policies/${policyId}`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.message || 'Could not update policy.');
                    }

                    sessionStorage.setItem('flash_success', 'Policy updated successfully!');
                    window.location.href = '/admin/dashboard';
                } catch (err) {
                    errorPlaceholder.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <span class="material-symbols-outlined me-2">error</span>
                            <div>${err.message}</div>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>

</html>
