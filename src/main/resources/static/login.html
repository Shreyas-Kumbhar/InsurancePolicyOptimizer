<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - Sign In</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center bg-light py-5">
        <div class="d-flex flex-column justify-content-center p-5 align-items-center bg-white rounded-4 shadow-sm" style="width: 100%; max-width: 500px;">
            <div class="w-100">
                <div class="text-center mb-5">
                    <span class="material-symbols-outlined text-primary fs-1 mb-3">lock</span>
                    <h2 class="fw-bolder font-headline">Sign In to Vault</h2>
                    <p class="text-secondary">Enter your credentials to access your dashboard</p>
                </div>
                
                <div id="login-error-placeholder"></div>

                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-primary small fw-semibold text-decoration-none">Forgot Password?</a>
                    </div>
                    <button class="w-100 btn btn-primary btn-lg rounded-3 fw-bold shadow-sm" type="submit">Sign In</button>
                    
                    <div class="text-center mt-4">
                        <p class="text-secondary small mb-2">Don't have an account? <a href="/register" class="text-primary fw-bold text-decoration-none">Request Access</a></p>
                        <p class="text-secondary small mb-0"><a href="/admin/login" class="text-danger fw-bold text-decoration-none">Login as Admin</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect to profile or policies
            if (getToken()) {
                if (getRole() === 'ADMIN') {
                    window.location.href = '/admin/dashboard';
                } else {
                    window.location.href = '/profile';
                }
                return;
            }

            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorPlaceholder = document.getElementById('login-error-placeholder');
                errorPlaceholder.innerHTML = ''; // Clear previous errors

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Invalid email or password.');
                    }

                    // Save auth response
                    saveAuth(data);
                    
                    // Redirect to policies configuration
                    window.location.href = '/policies';
                } catch (err) {
                    errorPlaceholder.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <span class="material-symbols-outlined me-2">error</span>
                            <div>${err.message}</div>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>

</html>
