<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - Request Access</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center bg-light py-5">
        <div class="d-flex flex-column justify-content-center p-5 align-items-center bg-white rounded-4 shadow-sm" style="width: 100%; max-width: 500px;">
            <div class="w-100">
                <div class="text-center mb-5">
                    <span class="material-symbols-outlined text-primary fs-1 mb-3">person_add</span>
                    <h2 class="fw-bolder font-headline">Request Access</h2>
                    <p class="text-secondary">Provide your details to initiate Vault setup.</p>
                </div>
                
                <div id="register-error-placeholder"></div>
                
                <form id="registerForm">
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6 form-floating">
                            <input type="text" class="form-control rounded-3" id="firstName" name="firstName" placeholder="First Name" required>
                            <label for="firstName" class="ms-2">First Name</label>
                        </div>
                        <div class="col-sm-6 form-floating">
                            <input type="text" class="form-control rounded-3" id="lastName" name="lastName" placeholder="Last Name" required>
                            <label for="lastName" class="ms-2">Last Name</label>
                        </div>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Password" required>
                        <label for="password">Create Password</label>
                    </div>
                    <button class="w-100 btn btn-primary btn-lg rounded-3 fw-bold shadow-sm" type="submit">Submit Request</button>
                    
                    <div class="text-center mt-4">
                        <p class="text-secondary small">Already have an account? <a href="/login" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('registerForm');
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorPlaceholder = document.getElementById('register-error-placeholder');
                errorPlaceholder.innerHTML = '';

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ firstName, lastName, email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Registration failed.');
                    }

                    // Save auth response and auto-login
                    saveAuth(data);
                    
                    // Redirect directly to policies dashboard
                    window.location.href = '/policies';
                } catch (err) {
                    errorPlaceholder.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <span class="material-symbols-outlined me-2">error</span>
                            <div>${err.message}</div>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>

</html>
