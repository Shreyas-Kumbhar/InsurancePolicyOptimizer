<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center justify-content-center bg-light py-5">
  <div class="d-flex flex-column justify-content-center p-5 align-items-center bg-white rounded-4 shadow-sm" style="width:100%;max-width:500px;">
    <div class="w-100">
      <div class="text-center mb-5">
        <span class="material-symbols-outlined text-primary fs-1 mb-3">lock</span>
        <h2 class="fw-bolder font-headline">Sign In to Vault</h2>
        <p class="text-secondary">Enter your credentials to access your dashboard</p>
      </div>

      <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center" role="alert">
        <span class="material-symbols-outlined me-2">error</span>
        <span th:text="${errorMsg}"></span>
      </div>
      <div th:if="${successMsg}" class="alert alert-success" role="alert">
        <span th:text="${successMsg}"></span>
      </div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-floating mb-3">
          <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="name@example.com" required/>
          <label for="email">Email address</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Password" required/>
          <label for="password">Password</label>
        </div>
        <button class="w-100 btn btn-primary btn-lg rounded-3 fw-bold shadow-sm" type="submit">Sign In</button>
        <div class="text-center mt-4">
          <p class="text-secondary small mb-2">
            Don't have an account?
            <a href="/register" class="text-primary fw-bold text-decoration-none">Request Access</a>
          </p>
          <p class="text-secondary small mb-0">
            <a href="/admin/login" class="text-danger fw-bold text-decoration-none">Login as Admin</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
