<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - My Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow-1 bg-light py-5">
        <div class="container py-3" id="profile-container" style="display: none;">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="display-5 fw-bolder font-headline text-dark mb-2">My Dashboard</h1>
                    <p class="fs-5 text-secondary">Welcome back, <span id="welcomeName">User</span>!</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4 text-center">
                            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 mb-3">
                                <span class="material-symbols-outlined fs-1">account_circle</span>
                            </div>
                            <h4 class="fw-bold mb-1" id="profileName">Loading...</h4>
                            <p class="text-secondary mb-4" id="profileEmail">Loading...</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-header bg-white border-bottom p-4">
                            <h4 class="mb-0 fw-bold font-headline d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined text-primary">inventory_2</span>
                                My Allocated Policies
                            </h4>
                        </div>
                        <div class="card-body p-0" id="policies-card-body">
                            <!-- Policies will be rendered dynamically by JavaScript -->
                            <div class="text-center p-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Guard clause for unauthenticated users
            if (!getToken()) {
                window.location.href = '/login';
                return;
            }

            // Check if there was a flash success message stored in session
            const successMsg = sessionStorage.getItem('flash_success');
            if (successMsg) {
                showFlash(successMsg, 'success');
                sessionStorage.removeItem('flash_success');
            }

            try {
                const response = await fetchWithAuth('/api/users/profile');
                if (!response.ok) {
                    throw new Error('Failed to retrieve user profile.');
                }

                const user = await response.json();
                
                // Update UI elements
                document.getElementById('welcomeName').textContent = user.firstName;
                document.getElementById('profileName').textContent = `${user.firstName} ${user.lastName}`;
                document.getElementById('profileEmail').textContent = user.email;
                
                const cardBody = document.getElementById('policies-card-body');
                if (user.allocatedPolicies && user.allocatedPolicies.length > 0) {
                    let listHtml = '<div class="list-group list-group-flush rounded-bottom-4">';
                    user.allocatedPolicies.forEach(policy => {
                        listHtml += `
                            <a href="/policies/${policy.id}" class="list-group-item list-group-item-action p-4">
                                <div class="d-flex w-100 justify-content-between align-items-center">
                                    <div>
                                        <h5 class="mb-1 fw-bold text-dark">${policy.name}</h5>
                                        <p class="mb-1 text-secondary">${policy.provider} • <span class="text-capitalize">${policy.type} Insurance</span></p>
                                        <div class="d-flex gap-3 mt-2">
                                            <span class="badge bg-light text-dark border">
                                                Premium: ₹${policy.premium.toLocaleString('en-IN')}
                                            </span>
                                            <span class="badge bg-light text-dark border">
                                                Coverage: ₹${policy.coverage.toLocaleString('en-IN')}
                                            </span>
                                        </div>
                                    </div>
                                    <span class="material-symbols-outlined text-muted">chevron_right</span>
                                </div>
                            </a>
                        `;
                    });
                    listHtml += '</div>';
                    cardBody.innerHTML = listHtml;
                } else {
                    cardBody.innerHTML = `
                        <div class="text-center p-5">
                            <span class="material-symbols-outlined text-secondary mb-3" style="font-size: 4rem; opacity: 0.5;">find_in_page</span>
                            <h5 class="text-secondary fw-semibold">No Policies Allocated Yet</h5>
                            <p class="text-muted mb-4">Run the optimization engine to find the best policies for your needs.</p>
                            <a href="/policies" class="btn btn-primary rounded-pill px-4 fw-bold">Find Policies</a>
                        </div>
                    `;
                }

                document.getElementById('profile-container').style.display = 'block';

            } catch (err) {
                console.error(err);
                showFlash(err.message || 'Error loading dashboard.', 'danger');
            }
        });
    </script>
</body>

</html>
