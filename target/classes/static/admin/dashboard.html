<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - Admin Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <div class="container py-5 flex-grow-1" id="dashboard-container" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold font-headline mb-0">Admin Dashboard</h2>
                <p class="text-secondary mb-0">Manage Insurance Policies</p>
            </div>
            <div class="d-flex gap-2">
                <a href="/admin/policies/new" class="btn btn-success fw-bold d-flex align-items-center gap-2">
                    <span class="material-symbols-outlined">add</span> Add Policy
                </a>
                <button onclick="logout()" class="btn btn-outline-danger fw-bold d-flex align-items-center gap-2">
                    <span class="material-symbols-outlined">logout</span> Logout
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Policy Name</th>
                                <th>Provider</th>
                                <th>Type</th>
                                <th>Premium (₹)</th>
                                <th>Coverage (₹)</th>
                                <th>Risk Level</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="policies-table-body">
                            <tr>
                                <td colspan="7" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Guard clause: requires ADMIN role
            if (!getToken() || getRole() !== 'ADMIN') {
                window.location.href = '/admin/login';
                return;
            }

            // Show flash success if stored
            const successMsg = sessionStorage.getItem('flash_success');
            if (successMsg) {
                showFlash(successMsg, 'success');
                sessionStorage.removeItem('flash_success');
            }

            await loadPolicies();
            document.getElementById('dashboard-container').style.display = 'block';
        });

        async function loadPolicies() {
            try {
                const response = await fetchWithAuth('/api/admin/dashboard');
                if (!response.ok) {
                    throw new Error('Failed to retrieve dashboard policies.');
                }

                const policies = await response.json();
                const tableBody = document.getElementById('policies-table-body');
                
                if (policies && policies.length > 0) {
                    tableBody.innerHTML = '';
                    policies.forEach(policy => {
                        let riskBadgeClass = 'bg-success';
                        if (policy.riskLevel === 'high') riskBadgeClass = 'bg-danger';
                        else if (policy.riskLevel === 'medium') riskBadgeClass = 'bg-warning text-dark';

                        tableBody.innerHTML += `
                            <tr>
                                <td class="ps-4 fw-semibold">${policy.name}</td>
                                <td>${policy.provider}</td>
                                <td class="text-capitalize">${policy.type}</td>
                                <td>${policy.premium.toLocaleString('en-IN')}</td>
                                <td>${policy.coverage.toLocaleString('en-IN')}</td>
                                <td>
                                    <span class="badge ${riskBadgeClass} text-capitalize">
                                        ${policy.riskLevel}
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <a href="/admin/policies/${policy.id}/edit" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center">
                                        <span class="material-symbols-outlined fs-6">edit</span>
                                    </a>
                                    <button onclick="deletePolicy(${policy.id})" class="btn btn-sm btn-outline-danger d-inline-flex align-items-center">
                                        <span class="material-symbols-outlined fs-6">delete</span>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="text-center py-5 text-secondary">
                                <span class="material-symbols-outlined fs-1 mb-2">find_in_page</span>
                                <p class="mb-0">No policies found. Create your first policy to get started.</p>
                            </td>
                        </tr>
                    `;
                }
            } catch (err) {
                console.error(err);
                showFlash(err.message, 'danger');
            }
        }

        async function deletePolicy(id) {
            if (!confirm('Are you sure you want to delete this policy?')) {
                return;
            }

            try {
                const response = await fetchWithAuth(`/api/admin/policies/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Could not delete policy.');
                }

                showFlash('Policy deleted successfully!', 'success');
                await loadPolicies();
            } catch (err) {
                console.error(err);
                showFlash(err.message, 'danger');
            }
        }
    </script>
</body>

</html>
