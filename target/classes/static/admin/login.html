<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - Admin Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <span class="material-symbols-outlined text-danger fs-1 mb-2">admin_panel_settings</span>
                            <h2 class="fw-bold font-headline">Admin Login</h2>
                            <p class="text-secondary">Access the administration dashboard</p>
                        </div>

                        <div id="login-error-placeholder"></div>

                        <form id="adminLoginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email address</label>
                                <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 rounded-3 fw-bold">Login as Admin</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Guard clause: if admin is already logged in, redirect
            if (getToken() && getRole() === 'ADMIN') {
                window.location.href = '/admin/dashboard';
                return;
            }

            const form = document.getElementById('adminLoginForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorPlaceholder = document.getElementById('login-error-placeholder');
                errorPlaceholder.innerHTML = '';

                try {
                    const response = await fetch('/api/auth/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Access Denied: Invalid Admin Credentials');
                    }

                    // Save auth details
                    saveAuth(data);

                    // Redirect to dashboard
                    window.location.href = '/admin/dashboard';
                } catch (err) {
                    errorPlaceholder.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <span class="material-symbols-outlined me-2">error</span>
                            <div>${err.message}</div>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>

</html>
