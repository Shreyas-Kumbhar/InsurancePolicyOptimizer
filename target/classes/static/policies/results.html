<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraksha Shield - Search Results</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow-1 bg-light py-5">
        <div class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h1 class="display-6 fw-bold font-headline mb-2" id="results-title">Search Results</h1>
                    <p class="text-secondary mb-0" id="results-count">Loading results...</p>
                </div>
                <a href="/policies" class="btn btn-outline-secondary d-flex align-items-center gap-2 rounded-3">
                    <span class="material-symbols-outlined fs-5">tune</span> Adjust Parameters
                </a>
            </div>

            <!-- Portfolio Alert (for combination mode) -->
            <div id="portfolio-alert-container"></div>

            <!-- Loading Spinner -->
            <div id="loading-spinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <!-- Error Display -->
            <div id="error-container" style="display: none;" class="alert alert-danger" role="alert">
                An error occurred while fetching optimization results.
            </div>

            <!-- Policies Grid -->
            <div class="row g-4" id="policies-grid" style="display: none;"></div>

            <!-- Empty State -->
            <div id="empty-state" style="display: none;" class="text-center py-5 bg-white rounded-4 shadow-sm">
                <span class="material-symbols-outlined display-1 text-muted opacity-50 mb-3">search_off</span>
                <h3 class="fw-bold font-headline">No policies found</h3>
                <p class="text-secondary">Try adjusting your budget or risk constraints.</p>
                <a href="/policies" class="btn btn-primary rounded-3 mt-2 px-4 shadow-sm">Modify Search</a>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Guard clause: results pages require user authentication
            if (!getToken()) {
                window.location.href = '/login';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const showAll = urlParams.get('show_all') === 'true';

            // Construct API url
            let apiUrl = '/api/policies/results';
            if (showAll) {
                apiUrl += '?show_all=true';
            } else {
                // Pass on parameters
                const params = [];
                if (urlParams.has('name')) params.push(`name=${encodeURIComponent(urlParams.get('name'))}`);
                if (urlParams.has('type')) params.push(`type=${encodeURIComponent(urlParams.get('type'))}`);
                if (urlParams.has('riskLevel')) params.push(`riskLevel=${encodeURIComponent(urlParams.get('riskLevel'))}`);
                if (urlParams.has('max_premium')) params.push(`max_premium=${encodeURIComponent(urlParams.get('max_premium'))}`);
                if (urlParams.has('coverage_min')) params.push(`coverage_min=${encodeURIComponent(urlParams.get('coverage_min'))}`);
                if (urlParams.has('coverage_max')) params.push(`coverage_max=${encodeURIComponent(urlParams.get('coverage_max'))}`);
                
                if (params.length > 0) {
                    apiUrl += '?' + params.join('&');
                }
            }

            try {
                const response = await fetchWithAuth(apiUrl);
                if (!response.ok) {
                    throw new Error('Could not calculate optimal policies.');
                }

                const result = await response.json(); // PolicyOptimizationResult DTO
                document.getElementById('loading-spinner').style.display = 'none';

                const policies = result.policies || [];
                const combinationMode = result.combinationMode;
                const totalPremium = result.totalPremium;
                const totalCoverage = result.totalCoverage;

                // Update headers
                const resultsTitle = document.getElementById('results-title');
                const resultsCount = document.getElementById('results-count');
                
                resultsTitle.textContent = combinationMode ? 'Optimal Policy Combination' : 'Search Results';
                resultsCount.textContent = combinationMode 
                    ? `This combination of ${policies.length} policies meets your criteria optimally.`
                    : `Found ${policies.length} policies matching your criteria.`;

                // If combination mode, show portfolio alert
                if (combinationMode && policies.length > 0) {
                    const alertContainer = document.getElementById('portfolio-alert-container');
                    alertContainer.innerHTML = `
                        <div class="alert d-flex align-items-center mb-4 border-0 shadow-sm rounded-4 p-4" role="alert"
                            style="background-color: #d1e7dd; color: #0f5132;">
                            <span class="material-symbols-outlined display-5 me-3">task_alt</span>
                            <div>
                                <h4 class="alert-heading fw-bold mb-1">Optimal Portfolio Found!</h4>
                                <p class="mb-0">This combination provides <strong class="fs-5">₹${totalCoverage.toLocaleString('en-IN')}</strong> in total coverage for a combined premium
                                    of <strong class="fs-5">₹${totalPremium.toLocaleString('en-IN')} / yr</strong>.</p>
                            </div>
                        </div>
                    `;
                }

                // Render grid
                const grid = document.getElementById('policies-grid');
                if (policies.length > 0) {
                    grid.innerHTML = '';
                    policies.forEach((policy, index) => {
                        const topMatchBadge = index === 0 ? `
                            <div class="position-absolute top-0 end-0 bg-success text-white px-3 py-1 fw-bold small rounded-start-pill mt-3 shadow-sm z-1"
                                style="background-color: var(--secondary) !important;">Top Match</div>
                        ` : '';

                        const iconName = policy.type === 'life' ? 'monitor_heart' : 'health_and_safety';
                        
                        // Risk Badge colors
                        let riskBadgeClass = 'bg-success';
                        if (policy.riskLevel === 'high') riskBadgeClass = 'bg-danger';
                        else if (policy.riskLevel === 'medium') riskBadgeClass = 'bg-warning text-dark';

                        grid.innerHTML += `
                            <div class="col-lg-4 col-md-6">
                                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden position-relative">
                                    ${topMatchBadge}
                                    <div class="card-body p-4">
                                        <div class="d-flex align-items-center gap-3 mb-4">
                                            <div class="bg-primary-subtle rounded-3 p-3 text-primary d-flex align-items-center justify-content-center">
                                                <span class="material-symbols-outlined fs-3">${iconName}</span>
                                            </div>
                                            <div>
                                                <span class="badge bg-secondary-subtle text-secondary mb-1 border">${policy.provider}</span>
                                                <h5 class="fw-bold font-headline mb-0 text-truncate" style="max-width: 160px;" title="${policy.name}">${policy.name}</h5>
                                            </div>
                                        </div>

                                        <div class="bg-light p-3 rounded-3 mb-4">
                                            <div class="row text-center mb-2">
                                                <div class="col-6 border-end">
                                                    <p class="small text-muted mb-1 text-uppercase fw-semibold" style="font-size: 0.70rem;">Annual Premium</p>
                                                    <p class="fs-5 fw-bold text-primary mb-0 font-headline">₹${policy.premium.toLocaleString('en-IN')}</p>
                                                </div>
                                                <div class="col-6">
                                                    <p class="small text-muted mb-1 text-uppercase fw-semibold" style="font-size: 0.70rem;">Coverage</p>
                                                    <p class="fs-5 fw-bold text-dark mb-0 font-headline">₹${policy.coverage.toLocaleString('en-IN')}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <ul class="list-unstyled mb-4">
                                            <li class="d-flex justify-content-between align-items-center mb-2">
                                                <span class="text-secondary small d-flex align-items-center gap-2">
                                                    <span class="material-symbols-outlined fs-6 text-muted">policy</span>
                                                    Type
                                                </span>
                                                <span class="fw-medium text-capitalize">${policy.type}</span>
                                            </li>
                                            <li class="d-flex justify-content-between align-items-center">
                                                <span class="text-secondary small d-flex align-items-center gap-2">
                                                    <span class="material-symbols-outlined fs-6 text-muted">speed</span>
                                                    Risk Profile
                                                </span>
                                                <span class="fw-medium text-capitalize ${policy.riskLevel === 'high' ? 'text-danger' : policy.riskLevel === 'medium' ? 'text-warning' : 'text-success'}">
                                                    ${policy.riskLevel} Risk
                                                </span>
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="card-footer bg-white border-top p-3 text-center">
                                        <a href="/policies/${policy.id}" class="btn btn-light w-100 fw-bold border text-primary">View Details</a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    grid.style.display = 'flex';
                } else {
                    document.getElementById('empty-state').style.display = 'block';
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loading-spinner').style.display = 'none';
                const errContainer = document.getElementById('error-container');
                errContainer.textContent = err.message || 'Failed to fetch search results.';
                errContainer.style.display = 'block';
            }
        });
    </script>
</body>

</html>
