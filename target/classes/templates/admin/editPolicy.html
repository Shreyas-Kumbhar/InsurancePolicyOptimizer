<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Edit Policy')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="container py-5 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold font-headline mb-0">Edit Policy</h2>
        <a href="/admin/dashboard" class="btn btn-outline-secondary fw-bold">Cancel</a>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">
          <form th:action="@{/admin/policies/{id}/edit(id=${policy.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-4">
              <div class="col-md-6">
                <label for="name" class="form-label fw-semibold">Policy Name</label>
                <input type="text" class="form-control form-control-lg rounded-3" id="name" name="name"
                       th:value="${policy.name}" required/>
              </div>
              <div class="col-md-6">
                <label for="provider" class="form-label fw-semibold">Provider</label>
                <input type="text" class="form-control form-control-lg rounded-3" id="provider" name="provider"
                       th:value="${policy.provider}" required/>
              </div>
              <div class="col-md-6">
                <label for="type" class="form-label fw-semibold">Policy Type</label>
                <select class="form-select form-select-lg rounded-3" id="type" name="type" required>
                  <option value="life"   th:selected="${policy.type == 'life'}">Life Insurance</option>
                  <option value="health" th:selected="${policy.type == 'health'}">Health Insurance</option>
                  <option value="car"    th:selected="${policy.type == 'car'}">Car Insurance</option>
                  <option value="home"   th:selected="${policy.type == 'home'}">Home Insurance</option>
                  <option value="travel" th:selected="${policy.type == 'travel'}">Travel Insurance</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="riskLevel" class="form-label fw-semibold">Risk Level</label>
                <select class="form-select form-select-lg rounded-3" id="riskLevel" name="riskLevel" required>
                  <option value="low"    th:selected="${policy.riskLevel == 'low'}">Low</option>
                  <option value="medium" th:selected="${policy.riskLevel == 'medium'}">Medium</option>
                  <option value="high"   th:selected="${policy.riskLevel == 'high'}">High</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="premium" class="form-label fw-semibold">Premium (₹)</label>
                <input type="number" class="form-control form-control-lg rounded-3" id="premium" name="premium"
                       th:value="${policy.premium}" min="0" required/>
              </div>
              <div class="col-md-6">
                <label for="coverage" class="form-label fw-semibold">Coverage (₹)</label>
                <input type="number" class="form-control form-control-lg rounded-3" id="coverage" name="coverage"
                       th:value="${policy.coverage}" min="0" required/>
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold">Update Policy</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
