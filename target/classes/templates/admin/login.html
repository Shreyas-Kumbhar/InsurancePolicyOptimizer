<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin Login')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
  <div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <span class="material-symbols-outlined text-danger fs-1 mb-2">admin_panel_settings</span>
            <h2 class="fw-bold font-headline">Admin Login</h2>
            <p class="text-secondary">Access the administration dashboard</p>
          </div>

          <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center" role="alert">
            <span class="material-symbols-outlined me-2">error</span>
            <span th:text="${errorMsg}"></span>
          </div>

          <!--
            Admin login uses the same Spring Security form login.
            The role-based routing in SecurityConfig directs ADMIN users to /admin/dashboard.
            We post to /login (Spring Security's processing URL) and rely on CustomUserDetailsService
            to load the admin with ROLE_ADMIN, then Spring Security redirects to /admin/dashboard.
          -->
          <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email address</label>
              <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" required/>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-danger btn-lg w-100 rounded-3 fw-bold">Login as Admin</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
