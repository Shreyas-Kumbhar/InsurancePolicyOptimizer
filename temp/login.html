<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<!-- Authentication Card -->
<div class="relative z-10 w-full max-w-md">
<!-- Branding Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-high mb-6 shadow-[0_12px_40px_rgba(25,28,31,0.06)]">
<span class="material-symbols-outlined fill text-primary text-3xl" data-icon="lock" data-weight="fill" style="">lock</span>
</div>
<h1 class="font-headline font-extrabold text-3xl tracking-tight text-primary mb-2" style="">Suraksha Shield</h1>
<p class="font-body text-on-surface-variant text-sm tracking-wide" style="">Secure Institutional Optimization</p>
</div>
<!-- Login Form Container -->
<div class="bg-surface-container-lowest rounded-xl p-8 relative">
<!-- Ambient Shadow -->
<div class="absolute inset-0 rounded-xl shadow-[0_12px_40px_rgba(25,28,31,0.06)] pointer-events-none"></div>
<!-- Ghost Border -->
<div class="absolute inset-0 rounded-xl border border-outline-variant opacity-15 pointer-events-none"></div>
<div class="relative z-10">
<h2 class="font-headline font-bold text-xl text-on-surface mb-6" style="">Authenticate Session</h2>
<form action="#" class="space-y-6" method="POST">
<!-- Institutional Email Field -->
<div>
<label class="block font-label text-sm font-medium text-on-surface-variant mb-2 tracking-[0.05em]" for="email" style="">Institutional Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="mail" style="">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-high border-0 border-b border-outline/30 text-on-surface focus:ring-0 focus:border-b-2 focus:border-primary transition-colors rounded-t-DEFAULT placeholder:text-outline-variant font-body" id="email" name="email" placeholder="user@institution.com" required="" type="email">
</div>
</div>
<!-- Passphrase Field -->
<div>
<label class="block font-label text-sm font-medium text-on-surface-variant mb-2 tracking-[0.05em]" for="passphrase" style="">Passphrase</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="key" style="">key</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-high border-0 border-b border-outline/30 text-on-surface focus:ring-0 focus:border-b-2 focus:border-primary transition-colors rounded-t-DEFAULT placeholder:text-outline-variant font-body" id="passphrase" name="passphrase" placeholder="••••••••••••••••" required="" type="password">
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-6">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-high" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-label text-sm text-on-surface-variant cursor-pointer hover:text-on-surface transition-colors" for="remember-me" style="">
                                    Maintain encrypted session on this device
                                </label>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label font-semibold text-on-primary bg-gradient-to-br from-primary to-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface transition-all transform active:scale-[0.99]" type="submit" style="">
                                Secure Access
                            </button>
</div>
</form>
<!-- Recovery Action -->
<div class="mt-8 text-center border-t border-outline-variant/10 pt-6">
<a class="font-label text-sm font-medium text-primary hover:text-primary-container transition-colors inline-flex items-center group" href="#" style="">
<span class="material-symbols-outlined text-sm mr-1 opacity-70 group-hover:opacity-100 transition-opacity" data-icon="security" style="">security</span>
                            Recover Access
                        </a>
</div>
</div>
</div>
<!-- Footer Compliance text -->
<p class="text-center font-label text-xs text-on-surface-variant/70 mt-8 tracking-[0.05em]" style="">
                Protected by Suraksha Shield Grade Encryption. <br> Unauthorized access is strictly prohibited.
            </p>
</div>
